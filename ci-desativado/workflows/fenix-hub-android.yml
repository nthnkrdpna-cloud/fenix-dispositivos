name: fenix-hub-android

on:
  push:
    paths:
      - 'android/fenix-hub/**'
      - '.github/workflows/fenix-hub-android.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/fenix-hub/**'
      - '.github/workflows/fenix-hub-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/fenix-hub
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Static contract test
        run: node ../../../scripts/dispositivos/fenix-hub-android.test.mjs

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-hub-g75-debug
          path: |
            android/fenix-hub/app/build/outputs/apk/debug/app-debug.apk
            android/fenix-hub/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
