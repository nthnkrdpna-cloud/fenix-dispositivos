name: fenix-hub-android

# CONTINUITY TRIGGER: keep APK build independently executable from the repository.
on:
  push:
    paths:
      - 'android/fenix-hub/**'
      - '.github/workflows/fenix-hub-android.yml'
      - 'scripts/dispositivos/fenix-hub-android.test.mjs'
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/fenix-hub/**'
      - '.github/workflows/fenix-hub-android.yml'
      - 'scripts/dispositivos/fenix-hub-android.test.mjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/fenix-hub
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Static contract test
        run: node ../../../scripts/dispositivos/fenix-hub-android.test.mjs

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee app/build/outputs/apk/debug/APK_BADGING.txt
          grep -F "package: name='com.nthnkrdpna.fenixhub.debug'" app/build/outputs/apk/debug/APK_BADGING.txt
          grep -F "sdkVersion:'33'" app/build/outputs/apk/debug/APK_BADGING.txt
          grep -F "targetSdkVersion:'36'" app/build/outputs/apk/debug/APK_BADGING.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-hub-g75-debug
          path: |
            android/fenix-hub/app/build/outputs/apk/debug/app-debug.apk
            android/fenix-hub/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/fenix-hub/app/build/outputs/apk/debug/APK_BADGING.txt
          if-no-files-found: error
