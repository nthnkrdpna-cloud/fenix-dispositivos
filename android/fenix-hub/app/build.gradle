plugins { id 'com.android.application' }

android {
    namespace 'com.nthnkrdpna.fenixhub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nthnkrdpna.fenixhub'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
